name: Build Android APK

# Free, unlimited cloud build (public repo) — no EAS / Expo account, no Android Studio.
# Trigger it manually: GitHub → Actions tab → "Build Android APK" → "Run workflow".
# Produces an installable, self-contained RELEASE apk (JS is bundled, so it runs on a
# phone with no PC / Metro tether). Uses Expo continuous native generation (prebuild),
# so no android/ native folder is committed to the repo.
#
# The apk is signed with Expo's default debug keystore — fine for sideloading a test
# build. To install: download the "dottie-android-apk" artifact from the run, unzip,
# copy the .apk to your Android phone, and open it (allow "install unknown apps").

on:
  workflow_dispatch:
  push:
    branches: [design-v2, gemini-learn-redesign]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/workflows/android-preview.yml'

jobs:
  android:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # ─── Optional gates (only run when the script exists) ─────────
      # Guards the Gemini Learn Redesign phases without breaking
      # design-v2, which predates these scripts. `--if-present` makes
      # `npm run` a no-op for scripts that aren't in package.json.
      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: Content validator (Phase 0 schema rules)
        run: npm run --if-present validate:content

      - name: Adaptive quiz harness (Phase 3, 17 invariants)
        run: npm run --if-present test:adaptive

      - name: Gentle Rhythm harness (Phase 4, 22 invariants)
        run: npm run --if-present test:rhythm

      - name: Predictor scenarios harness (~60 assertions across 14 real user scenarios)
        run: npm run --if-present test:predictor

      - name: App journey harness (10 pure-engine journeys, all combos)
        run: npm run --if-present test:journey

      - name: UI onPress audit (every Pressable / Button has a handler)
        run: npm run --if-present audit:ui

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Raise Gradle memory (avoid OOM on the RN native build)
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dottie-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
