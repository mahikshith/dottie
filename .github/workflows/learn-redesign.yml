name: Learn Redesign — Checks + Android APK

# CI/CD for the `gemini-learn-redesign` branch. Two jobs:
#
#   1. checks — fast (~2-3 min): npm ci, tsc --noEmit, and the three harnesses
#      that guard the Gemini Learn Redesign phases:
#        - npm run validate:content   (Phase 0 schema — 4 rules)
#        - npm run test:adaptive      (Phase 3 quiz engine — 17 invariants)
#        - npm run test:rhythm        (Phase 4 cadence — 22 invariants)
#      Runs on every push to the branch, every PR into it, and workflow_dispatch.
#      Does NOT respect `[skip ci]` when the user manually dispatches — use
#      dispatch to force a run even after a docs-only push.
#
#   2. android — the same self-contained release APK the design-v2 workflow
#      produces, but ONLY runs when `checks` is green AND `[skip ci]` is not on
#      the tip commit. Owner's standing rule: back up freely with `[skip ci]`
#      on the tip commit; drop the flag when a preview APK is wanted. Also
#      dispatchable manually via the Actions tab.
#
# Both jobs use the existing android-preview.yml recipe verbatim (Node 20 + JDK
# 17 + expo prebuild + gradle assembleRelease). No EAS, no Expo account, no
# committed android/ folder.

on:
  workflow_dispatch:
    inputs:
      skip_android:
        description: 'Skip the APK build (checks only)'
        required: false
        default: 'false'
  push:
    branches: [gemini-learn-redesign]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'babel.config.js'
      - 'tsconfig.json'
      - '.github/workflows/learn-redesign.yml'
  pull_request:
    branches: [gemini-learn-redesign]

jobs:
  checks:
    name: Type-check + harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit

      - name: Content validator (Phase 0 — schema rules)
        run: npm run validate:content

      - name: Adaptive quiz harness (Phase 3 — 17 invariants)
        run: npm run test:adaptive

      - name: Gentle Rhythm harness (Phase 4 — 22 invariants)
        run: npm run test:rhythm

  android:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: checks
    # Skip when the tip commit carries [skip ci] (owner's standing back-up
    # flow), or when the user dispatched with skip_android=true. Never blocks
    # `checks` from running — that always runs on push/PR so regressions are
    # caught even during a skip-ci week.
    if: >
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.event.inputs.skip_android != 'true' &&
      github.event_name != 'pull_request'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Raise Gradle memory (avoid OOM on the RN native build)
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dottie-android-apk-gemini-redesign
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
